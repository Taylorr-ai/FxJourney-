<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08111f">
  <title>Trade Journal — FX Journey</title>
  <style>
    :root{color-scheme:dark;--bg:#07111f;--panel:#0d1b2d;--line:#213653;--cyan:#67dcff;--white:#f4f8ff;--muted:#8da2ba;--green:#38d9a9;--red:#ff7184}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;background:radial-gradient(circle at 75% -20%,#173b65 0,transparent 35%),var(--bg);color:var(--white);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
    main{max-width:1180px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:24px}.top h1{margin:0;font-size:26px}.top a{color:var(--cyan);text-decoration:none}.top a:hover{text-decoration:underline}
    .summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px}.card,.trade,.table-wrap{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:16px}.label{color:var(--muted);font-size:12px}.value{margin-top:5px;font-size:22px;font-weight:750}.positive{color:var(--green)}.negative{color:var(--red)}
    .trade-list{display:grid;gap:12px}.trade-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.trade-title{font-size:17px;font-weight:750}.trade-meta{color:var(--muted);font-size:12px}.trade-data{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:16px}.trade-data .value{font-size:15px;overflow-wrap:anywhere}.actions{display:flex;gap:8px;flex-wrap:wrap}.button{border:1px solid #34516e;border-radius:8px;padding:8px 11px;background:#10243a;color:var(--white);cursor:pointer}.button:hover{border-color:var(--cyan)}.photos{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.photos img{width:120px;height:86px;object-fit:cover;border:1px solid var(--line);border-radius:8px;cursor:zoom-in}.empty{padding:30px;text-align:center;color:var(--muted)}
    .backdrop{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:18px;background:#02080cdd}.backdrop.open{display:flex}.dialog{width:min(900px,100%);max-height:92vh;overflow:auto;padding:20px;border:1px solid #294563;border-radius:16px;background:#0c1a2b}.dialog h2{margin:0 0 16px}.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.field{display:grid;gap:6px;margin:6px 0}.field label{font-size:12px;color:#b6c8da}.field input,.field select{width:100%;padding:10px;border:1px solid #334b67;border-radius:8px;background:#091625;color:white;font:inherit}.field input[type=file]{padding:8px}.hint{font-size:11px;color:var(--muted)}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.image-edit-list{display:flex;flex-wrap:wrap;gap:8px}.image-edit-item{position:relative}.image-edit-item img{width:90px;height:70px;object-fit:cover;border-radius:7px}.image-edit-item button{position:absolute;right:2px;top:2px;border:0;border-radius:50%;background:#690e20;color:#fff;cursor:pointer}.lightbox img{max-width:min(95vw,1200px);max-height:90vh;object-fit:contain}.lightbox{cursor:zoom-out}
    @media(max-width:700px){body{padding:14px}.summary{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.trade-data{grid-template-columns:repeat(2,minmax(0,1fr))}.form-grid{grid-template-columns:1fr}.trade-head{flex-direction:column}}
  </style>
</head>
<body>
  <main>
    <header class="top"><h1>Trade Journal</h1><a href="./">← Back to dashboard</a></header>
    <section class="summary" aria-label="Trade summary">
      <div class="card"><div class="label">Total trades</div><div class="value" id="total">0</div></div>
      <div class="card"><div class="label">Winning trades</div><div class="value positive" id="wins">0</div></div>
      <div class="card"><div class="label">Net P&amp;L</div><div class="value" id="net">$0.00</div></div>
    </section>
    <section id="tradeList" class="trade-list" aria-label="All logged trades"></section>
  </main>

  <div class="backdrop" id="editBackdrop"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="editTitle"><h2 id="editTitle">Edit trade</h2>
    <div class="form-grid">
      <div class="field"><label for="editCategory">Market</label><select id="editCategory"><option value="forex">Forex</option><option value="metals">Metals</option><option value="crypto">Crypto</option><option value="stocks">Stocks</option><option value="indices">Indices</option><option value="other">Other</option></select></div>
      <div class="field"><label for="editSymbol">Instrument / symbol</label><input id="editSymbol" required></div>
      <div class="field"><label for="editSide">Direction</label><select id="editSide"><option>Long</option><option>Short</option></select></div>
      <div class="field"><label for="editLots">Position size / quantity</label><input id="editLots" type="number" step="any" min="0"></div>
      <div class="field"><label for="editEntry">Entry price</label><input id="editEntry" type="number" step="any"></div>
      <div class="field"><label for="editStop">Stop loss</label><input id="editStop" type="number" step="any"></div>
      <div class="field"><label for="editPnl">Realized P&amp;L</label><input id="editPnl" type="number" step="any"></div>
      <div class="field"><label for="editEntryTime">Entry date &amp; time</label><input id="editEntryTime" type="datetime-local"></div>
      <div class="field"><label for="editExitTime">Exit date &amp; time</label><input id="editExitTime" type="datetime-local"></div>
      <div class="field" style="grid-column:1/-1"><label>Saved trade images (select × to remove)</label><div class="image-edit-list" id="savedImages"></div></div>
      <div class="field" style="grid-column:1/-1"><label for="editImages">Add images (up to 3 per trade total)</label><input id="editImages" type="file" accept="image/*" multiple><span class="hint">Images stay in this browser with your journal entry.</span><div class="image-edit-list" id="newImages"></div></div>
    </div>
    <div class="dialog-actions"><button class="button" id="cancelEdit" type="button">Cancel</button><button class="button" id="saveEdit" type="button">Save changes</button></div>
  </section></div>
  <div class="backdrop lightbox" id="lightbox" aria-label="Trade image, click to close"><img id="largeImage" alt="Trade attachment"></div>

  <script>
    const store='fxjourney-trades',settingsKey='fxjourney-settings';
    const $=selector=>document.querySelector(selector);
    function readJSON(key,fallback){try{return JSON.parse(localStorage.getItem(key)||JSON.stringify(fallback))}catch{return fallback}}
    let trades=readJSON(store,[]);if(!Array.isArray(trades))trades=[];
    const currency=readJSON(settingsKey,{}).currency||'USD';let editingIndex=-1,keptPhotos=[],addedPhotos=[];
    const money=n=>{try{return new Intl.NumberFormat(undefined,{style:'currency',currency}).format(Number(n)||0)}catch{return '$'+(Number(n)||0).toFixed(2)}};
    const safe=value=>String(value??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const readableDate=value=>{if(!value)return '—';const date=new Date(value);return Number.isNaN(date.getTime())?safe(value):date.toLocaleString()};
    function render(){const wins=trades.filter(t=>Number(t.pnl)>0),net=trades.reduce((sum,t)=>sum+(Number(t.pnl)||0),0);$('#total').textContent=trades.length;$('#wins').textContent=wins.length;const netEl=$('#net');netEl.textContent=money(net);netEl.classList.toggle('negative',net<0);netEl.classList.toggle('positive',net>=0);const list=$('#tradeList');if(!trades.length){list.innerHTML='<div class="card empty">No trades logged yet. Use “Log Trade” on the dashboard to add your first trade.</div>';return}list.innerHTML=trades.map((t,i)=>{const pnl=Number(t.pnl)||0,photos=Array.isArray(t.photos)?t.photos:[];return `<article class="trade"><div class="trade-head"><div><div class="trade-title">${safe(t.symbol||'Instrument')} <span class="trade-meta">· ${safe(t.category||'Trade')}</span></div><div class="trade-meta">${safe(t.side||'—')} · Entry ${readableDate(t.entryTime)}${t.exitTime?' · Exit '+readableDate(t.exitTime):''}</div></div><div class="actions"><button class="button" type="button" data-edit="${i}">Edit trade</button></div></div><div class="trade-data"><div><div class="label">Size / quantity</div><div class="value">${safe(t.lots)}</div></div><div><div class="label">Entry price</div><div class="value">${safe(t.entry)}</div></div><div><div class="label">Stop loss</div><div class="value">${safe(t.stop)}</div></div><div><div class="label">Realized P&amp;L</div><div class="value ${pnl<0?'negative':'positive'}">${money(pnl)}</div></div><div><div class="label">Result</div><div class="value ${pnl<0?'negative':'positive'}">${pnl<0?'Loss':'Win'}</div></div></div>${photos.length?`<div class="photos" aria-label="Trade images">${photos.map((src,p)=>`<img src="${src}" alt="Trade ${i+1} image ${p+1}" loading="lazy" data-photo="${i}" data-photo-index="${p}">`).join('')}</div>`:'<div class="trade-meta" style="margin-top:12px">No images attached</div>'}</article>`}).join('');list.querySelectorAll('[data-edit]').forEach(button=>button.addEventListener('click',()=>openEditor(Number(button.dataset.edit))));list.querySelectorAll('[data-photo]').forEach(image=>image.addEventListener('click',()=>{const src=trades[Number(image.dataset.photo)]?.photos?.[Number(image.dataset.photoIndex)];if(src){$('#largeImage').src=src;$('#lightbox').classList.add('open')}}))}
    function renderSavedPhotos(){const container=$('#savedImages');container.replaceChildren(...keptPhotos.map((src,index)=>{const box=document.createElement('div');box.className='image-edit-item';const img=document.createElement('img');img.src=src;img.alt='Saved trade image';const remove=document.createElement('button');remove.type='button';remove.textContent='×';remove.setAttribute('aria-label','Remove image');remove.addEventListener('click',()=>{keptPhotos.splice(index,1);renderSavedPhotos()});box.append(img,remove);return box}))}
    function renderAddedPhotos(){const container=$('#newImages');container.replaceChildren(...addedPhotos.map((src,index)=>{const box=document.createElement('div');box.className='image-edit-item';const img=document.createElement('img');img.src=src;img.alt='New trade image';const remove=document.createElement('button');remove.type='button';remove.textContent='×';remove.setAttribute('aria-label','Remove new image');remove.addEventListener('click',()=>{addedPhotos.splice(index,1);renderAddedPhotos()});box.append(img,remove);return box}))}
    function asDateTimeLocal(value){if(!value)return '';const date=new Date(value);if(Number.isNaN(date.getTime()))return String(value).slice(0,16);return new Date(date.getTime()-date.getTimezoneOffset()*60000).toISOString().slice(0,16)}
    function openEditor(index){editingIndex=index;const t=trades[index];$('#editCategory').value=t.category||'other';$('#editSymbol').value=t.symbol||'';$('#editSide').value=/short/i.test(t.side||'')?'Short':'Long';$('#editLots').value=t.lots??'';$('#editEntry').value=t.entry??'';$('#editStop').value=t.stop??'';$('#editPnl').value=t.pnl??'';$('#editEntryTime').value=asDateTimeLocal(t.entryTime);$('#editExitTime').value=asDateTimeLocal(t.exitTime);keptPhotos=Array.isArray(t.photos)?t.photos.slice():[];addedPhotos=[];$('#editImages').value='';renderSavedPhotos();renderAddedPhotos();$('#editBackdrop').classList.add('open')}
    function resizeImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(new Error('Could not read the selected image.'));reader.onload=()=>{const image=new Image();image.onerror=()=>reject(new Error('Could not open the selected image.'));image.onload=()=>{const scale=Math.min(1,1200/Math.max(image.width,image.height)),canvas=document.createElement('canvas');canvas.width=Math.round(image.width*scale);canvas.height=Math.round(image.height*scale);canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.72))};image.src=reader.result};reader.readAsDataURL(file)})}
    $('#editImages').addEventListener('change',async event=>{const files=Array.from(event.target.files||[]);if(keptPhotos.length+addedPhotos.length+files.length>3){alert('A trade can have up to 3 images. Remove an existing image first if needed.');event.target.value='';return}if(files.some(file=>!file.type.startsWith('image/'))){alert('Please select image files only.');event.target.value='';return}try{addedPhotos.push(...await Promise.all(files.map(resizeImage)));renderAddedPhotos()}catch(error){alert(error.message)}event.target.value=''});
    $('#saveEdit').addEventListener('click',()=>{if(editingIndex<0)return;const symbol=$('#editSymbol').value.trim();if(!symbol){alert('Instrument / symbol is required.');return}const old=trades[editingIndex];trades[editingIndex]={...old,category:$('#editCategory').value,symbol,side:$('#editSide').value,lots:Number($('#editLots').value)||0,entry:Number($('#editEntry').value)||0,stop:Number($('#editStop').value)||0,pnl:Number($('#editPnl').value)||0,entryTime:$('#editEntryTime').value||'',exitTime:$('#editExitTime').value||'',photos:[...keptPhotos,...addedPhotos]};try{localStorage.setItem(store,JSON.stringify(trades))}catch{trades[editingIndex]=old;alert('Not enough browser storage to save these changes. Remove an image or use smaller images.');return}$('#editBackdrop').classList.remove('open');render()});
    $('#cancelEdit').addEventListener('click',()=>$('#editBackdrop').classList.remove('open'));$('#editBackdrop').addEventListener('click',event=>{if(event.target.id==='editBackdrop')event.currentTarget.classList.remove('open')});$('#lightbox').addEventListener('click',()=>{$('#lightbox').classList.remove('open');$('#largeImage').src=''});document.addEventListener('keydown',event=>{if(event.key==='Escape'){ $('#editBackdrop').classList.remove('open');$('#lightbox').classList.remove('open')}});render();
  </script>
</body>
</html>
