<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>Economic Calendar — FX Journey</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 24px; background: #07111f; color: #f4f8ff; font: 16px/1.5 system-ui, sans-serif; }
    main { width: min(1100px, 100%); margin: 0 auto; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
    h1 { margin: 0; font-size: 1.6rem; }
    a { color: #8ec5ff; }
    .calendar { overflow: hidden; border-radius: 10px; background: white; }
    iframe { display: block; width: 100%; height: 650px; border: 0; }
    .poweredBy { padding: 10px 0; color: #a7b6c8; text-align: right; font: 11px Arial, Helvetica, sans-serif; }
    @media (max-width: 600px) { body { padding: 14px; } header { align-items: flex-start; flex-direction: column; } iframe { height: 700px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Economic Calendar</h1>
      <a href="./">← Back to FX Journey</a>
    </header>
    <div class="calendar">
      <iframe src="https://sslecal2.investing.com?columns=exc_flags,exc_currency,exc_importance,exc_actual,exc_forecast,exc_previous&amp;features=datepicker,timezone&amp;countries=25,32,6,37,72,22,17,39,14,10,35,43,56,36,110,11,26,12,4,5&amp;calType=week&amp;timeZone=8&amp;lang=1" title="Investing.com Economic Calendar" loading="lazy" allowtransparency="true"></iframe>
    </div>
    <div class="poweredBy">Real Time Economic Calendar provided by <a href="https://www.investing.com/" rel="nofollow" target="_blank">Investing.com</a>.</div>
  </main>
</body>
</html>
