<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08111f"><title>FX Journey — Trading journal</title>
<style>
:root{--bg:#07111f;--panel:#0d1b2d;--line:#213653;--cyan:#67dcff;--white:#f4f8ff;--muted:#8da2ba;--green:#38d9a9;--red:#ff7184}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% -20%,#173b65 0,transparent 35%),var(--bg);color:var(--white);font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}.sidebar{padding:20px 14px;border-right:1px solid var(--line);background:#091625}.brand{font-size:19px;font-weight:800;margin:0 8px 22px}.brand:before{content:'◉';color:var(--cyan);margin-right:8px}.nav{display:grid;gap:6px}.nav button{border:0;border-radius:8px;background:transparent;color:var(--muted);padding:10px 12px;text-align:left;font:inherit;cursor:pointer}.nav button.active,.nav button:hover{color:var(--white);background:#10243a}.main{min-width:0}.topbar{height:82px;padding:16px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.topbar h1{font-size:24px;margin:0}.date{color:var(--muted)}.actions{display:flex;gap:8px}.section{display:none;padding:20px 24px}.section.active{display:block}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}.card,.panel{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:16px}.label{color:var(--muted);font-size:12px}.metric{font-size:24px;font-weight:800;margin-top:7px}.positive{color:var(--green)}.negative{color:var(--red)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}table{width:100%;border-collapse:collapse}th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-size:12px}tbody tr:last-child td{border-bottom:0}.button,.secondary,.primary{padding:9px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;cursor:pointer}.button,.secondary{background:#10243a;color:var(--white)}.primary{background:#087da0;border-color:#087da0;color:white;font-weight:700}.modal-backdrop{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:16px;background:#02080cdd}.modal-backdrop.open{display:flex}.modal{width:min(820px,100%);max-height:92vh;overflow:auto;padding:22px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}.modal h2{margin-top:0}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:5px}.field label{font-weight:650}.field input,.field select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#071522;color:var(--white);font:inherit}.field.full{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.hint{color:var(--muted);font-size:12px}.trade-photo{width:56px;height:56px;object-fit:cover;border-radius:7px;border:1px solid var(--line)}@media(max-width:900px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.grid,.settings-grid{grid-template-columns:1fr}}@media(max-width:650px){.app{display:block}.sidebar{position:fixed;z-index:10;bottom:0;left:0;right:0;height:58px;padding:5px;border-right:0;border-top:1px solid var(--line)}.brand{display:none}.nav{display:flex}.nav button{flex:1;text-align:center;padding:10px 4px}.main{padding-bottom:58px}.topbar{height:auto;padding:12px 14px}.topbar h1{font-size:19px}.section{padding:14px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
</head>
<body>
<div class="app"><aside class="sidebar"><div class="brand">FX Journey</div><nav class="nav" aria-label="Main navigation"><button type="button" class="active" data-page="dashboard">◫ &nbsp; Dashboard</button><button type="button" data-page="trades">▤ &nbsp; Trade journal</button><button type="button" data-page="analytics">⌁ &nbsp; Analytics</button><button type="button" data-page="settings">⚙ &nbsp; Settings</button></nav></aside>
<main class="main"><header class="topbar"><div><h1 id="pageTitle">Your Journey</h1><div class="date" id="today"></div></div><div class="actions"><button class="secondary" id="goTradeLogger" type="button">Trade logger</button><button class="primary" id="addTrade" type="button">+ Log trade</button><button class="secondary" id="goSettings" type="button">⚙</button></div></header>
<section class="section active" id="dashboardPage"><div class="cards"><div class="card"><div class="label">Net P&amp;L</div><div class="metric" id="net">$0.00</div></div><div class="card"><div class="label">Win rate</div><div class="metric" id="winRate">0%</div></div><div class="card"><div class="label">Total trades</div><div class="metric" id="totalTrades">0</div></div><div class="card"><div class="label">Avg trade</div><div class="metric" id="avgTrade">$0</div></div></div><div class="panel"><h3>Recent trades</h3><div class="table-wrap"><table><thead><tr><th>Asset</th><th>Side</th><th>Entry</th><th>Stop</th><th>Target</th><th>P&amp;L</th></tr></thead><tbody id="recentRows"></tbody></table></div></div></section>
<section class="section" id="tradesPage"><div class="panel"><h3>Trade journal</h3><div class="table-wrap"><table><thead><tr><th>Date</th><th>Asset</th><th>Side</th><th>Size</th><th>Entry</th><th>Stop</th><th>Take profit</th><th>P&amp;L</th></tr></thead><tbody id="tradeRows"></tbody></table></div></div></section>
<section class="section" id="analyticsPage"><div class="cards"><div class="card"><div class="label">Average win</div><div class="metric positive" id="avgWin">$0</div></div><div class="card"><div class="label">Average loss</div><div class="metric negative" id="avgLoss">$0</div></div><div class="card"><div class="label">Profit factor</div><div class="metric" id="profitFactor">0</div></div></div></section>
<section class="section" id="settingsPage"><div class="settings-grid"><div class="panel"><h3>Account profile</h3><div class="field"><label for="accountName">Display name</label><input id="accountName"></div><div class="field"><label for="accountCurrency">Account currency</label><select id="accountCurrency"><option>USD</option><option>EUR</option><option>GBP</option></select></div><button class="primary" id="saveSettings" type="button">Save settings</button></div></div></section>
</main></div>
<div class="modal-backdrop" id="tradeModal"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="tradeModalTitle"><h2 id="tradeModalTitle">Log trade</h2><div class="form-grid">
<div class="field"><label for="tradeCategory">Market</label><select id="tradeCategory"><option value="forex">Forex</option><option value="metals">Metals</option><option value="indices">Indices</option><option value="crypto">Crypto</option><option value="stocks">Stocks</option><option value="other">Other</option></select></div>
<div class="field"><label for="tradeInstrument">Instrument</label><input id="tradeInstrument" list="tradeInstrumentOptions" autocomplete="off" placeholder="Search pair or asset"><datalist id="tradeInstrumentOptions"></datalist></div>
<div class="field"><label for="tradeSide">Direction</label><select id="tradeSide"><option>Long</option><option>Short</option></select></div>
<div class="field"><label for="tradeLots">Position size / quantity</label><input id="tradeLots" type="number" step="any" min="0"></div>
<div class="field"><label for="tradeEntry">Entry price</label><input id="tradeEntry" type="number" step="any"></div>
<div class="field"><label for="tradeStop">Stop loss</label><input id="tradeStop" type="number" step="any" placeholder="Optional stop price"></div>
<div class="field"><label for="tradeTakeProfit">Take profit</label><input id="tradeTakeProfit" type="number" step="any" placeholder="Optional target price"></div>
<div class="field"><label for="tradePnl">Realized P&amp;L</label><input id="tradePnl" type="number" step="any"></div>
<div class="field"><label for="tradeEntryTime">Entry date &amp; time</label><input id="tradeEntryTime" type="datetime-local"></div>
<div class="field"><label for="tradeExitTime">Exit date &amp; time</label><input id="tradeExitTime" type="datetime-local"></div>
</div><div class="modal-actions"><button class="secondary" id="cancelTrade" type="button">Cancel</button><button class="primary" id="saveTrade" type="button">Save trade</button></div></div></div>
<script>
const $=selector=>document.querySelector(selector),store='fxjourney-trades',settingsKey='fxjourney-settings';
function readJSON(key,fallback){try{return JSON.parse(localStorage.getItem(key)||JSON.stringify(fallback))}catch{return fallback}}let trades=readJSON(store,[]);if(!Array.isArray(trades))trades=[];let settings=readJSON(settingsKey,{}),editingIndex=-1;
const assets={forex:'AUDCAD AUDCHF AUDJPY AUDNZD AUDUSD CADCHF CADJPY CHFJPY EURAUD EURCAD EURCHF EURGBP EURJPY EURNZD EURUSD GBPAUD GBPCAD GBPCHF GBPJPY GBPNZD GBPUSD NZDCAD NZDCHF NZDJPY NZDUSD USDCAD USDCHF USDJPY USDCNH USDHKD USDSGD USDZAR'.split(' '),metals:'XAUUSD XAGUSD XPTUSD XPDUSD XAUEUR XAUGBP XAUJPY XAGEUR COPPER'.split(' '),indices:'US30 US500 NAS100 US100 US2000 UK100 GER40 DE40 FRA40 EU50 JP225 AUS200 HK50'.split(' '),crypto:'BTCUSD ETHUSD SOLUSD XRPUSD ADAUSD DOGEUSD BNBUSD LTCUSD BCHUSD AVAXUSD DOTUSD LINKUSD'.split(' '),stocks:'AAPL MSFT NVDA AMZN GOOGL META TSLA JPM V SPY QQQ'.split(' '),other:[]};
function fillAssets(){const category=$('#tradeCategory').value,list=$('#tradeInstrumentOptions');list.replaceChildren(...(assets[category]||[]).map(symbol=>{const option=document.createElement('option');option.value=symbol;return option}))}
$('#tradeCategory').addEventListener('change',fillAssets);fillAssets();
function money(value){const amount=Number(value)||0;try{return new Intl.NumberFormat(undefined,{style:'currency',currency:settings.currency||'USD'}).format(amount)}catch{return '$'+amount.toFixed(2)}}
function escapeHTML(value){return String(value??'—').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
function localDateTime(){const now=new Date(),offset=now.getTimezoneOffset();return new Date(now.getTime()-offset*60000).toISOString().slice(0,16)}
function go(name){document.querySelectorAll('.section').forEach(section=>section.classList.remove('active'));const page=$('#'+name+'Page');if(page)page.classList.add('active');document.querySelectorAll('.nav [data-page]').forEach(button=>button.classList.toggle('active',button.dataset.page===name));}
document.querySelectorAll('.nav [data-page]').forEach(button=>button.addEventListener('click',()=>go(button.dataset.page)));$('#goSettings').addEventListener('click',()=>go('settings'));$('#goTradeLogger').addEventListener('click',()=>location.href='./trade-logger.html');
function render(){const wins=trades.filter(t=>Number(t.pnl)>0),losses=trades.filter(t=>Number(t.pnl)<0),net=trades.reduce((sum,t)=>sum+(Number(t.pnl)||0),0);$('#net').textContent=money(net);$('#totalTrades').textContent=trades.length;$('#winRate').textContent=trades.length?Math.round(wins.length/trades.length*100)+'%':'0%';$('#avgTrade').textContent=money(trades.length?net/trades.length:0);const winTotal=wins.reduce((sum,t)=>sum+(Number(t.pnl)||0),0),lossTotal=Math.abs(losses.reduce((sum,t)=>sum+(Number(t.pnl)||0),0));$('#avgWin').textContent=money(wins.length?winTotal/wins.length:0);$('#avgLoss').textContent=money(losses.length?lossTotal/losses.length:0);$('#profitFactor').textContent=lossTotal? (winTotal/lossTotal).toFixed(2):winTotal?'∞':'0';const row=t=>`<tr><td>${escapeHTML(t.entryTime?new Date(t.entryTime).toLocaleDateString():'' )}</td><td>${escapeHTML(t.symbol)}</td><td>${escapeHTML(t.side)}</td><td>${escapeHTML(t.lots)}</td><td>${escapeHTML(t.entry)}</td><td>${escapeHTML(t.stopLoss ?? t.stop ?? '')}</td><td>${escapeHTML(t.takeProfit ?? t.target ?? '')}</td><td class="${Number(t.pnl)>=0?'positive':'negative'}">${money(t.pnl)}</td></tr>`;$('#tradeRows').innerHTML=trades.map(row).join('');$('#recentRows').innerHTML=trades.slice(0,8).map(t=>`<tr><td>${escapeHTML(t.symbol)}</td><td>${escapeHTML(t.side)}</td><td>${escapeHTML(t.entry)}</td><td>${escapeHTML(t.stopLoss ?? t.stop ?? '')}</td><td>${escapeHTML(t.takeProfit ?? t.target ?? '')}</td><td class="${Number(t.pnl)>=0?'positive':'negative'}">${money(t.pnl)}</td></tr>`).join('')}
function resetForm(){['tradeLots','tradeEntry','tradeStop','tradeTakeProfit','tradePnl','tradeExitTime','tradeEntryTime','tradeInstrument'].forEach(id=>$('#'+id).value='');$('#tradeCategory').value='forex';fillAssets();$('#tradeSide').value='Long';$('#tradeEntryTime').value=localDateTime();editingIndex=-1}
$('#today').textContent=new Intl.DateTimeFormat(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'}).format(new Date());$('#accountName').value=settings.name||'';if(settings.currency)$('#accountCurrency').value=settings.currency;
$('#addTrade').addEventListener('click',()=>{resetForm();$('#tradeModal').classList.add('open')});$('#cancelTrade').addEventListener('click',()=>$('#tradeModal').classList.remove('open'));$('#tradeModal').addEventListener('click',event=>{if(event.target.id==='tradeModal')event.currentTarget.classList.remove('open')});
$('#saveTrade').addEventListener('click',()=>{const symbol=$('#tradeInstrument').value.trim().toUpperCase();if(!symbol){alert('Choose or enter an instrument.');return}const stopLoss=$('#tradeStop').value===''?null:Number($('#tradeStop').value),takeProfit=$('#tradeTakeProfit').value===''?null:Number($('#tradeTakeProfit').value);const trade={category:$('#tradeCategory').value,symbol,side:$('#tradeSide').value,lots:Number($('#tradeLots').value)||0,entry:Number($('#tradeEntry').value)||0,stop:Number($('#tradeStop').value)||null,stopLoss,takeProfit,target:takeProfit,pnl:Number($('#tradePnl').value)||0,entryTime:$('#tradeEntryTime').value,exitTime:$('#tradeExitTime').value,images:[]};if(editingIndex>=0){trade.images=trades[editingIndex].images||[];trades[editingIndex]=trade}else trades.unshift(trade);localStorage.setItem(store,JSON.stringify(trades));$('#tradeModal').classList.remove('open');render()});
$('#saveSettings').addEventListener('click',()=>{settings={...settings,name:$('#accountName').value.trim(),currency:$('#accountCurrency').value};localStorage.setItem(settingsKey,JSON.stringify(settings));render()});render();
</script>
</body>
</html>
